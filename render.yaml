services:
  - type: web
    name: solar-forecast-backend
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && cd .. && PYTHONPATH=backend uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
