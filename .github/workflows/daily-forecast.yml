name: Daily Solar Generation Forecast Cron

on:
  schedule:
    # 20:05 UTC відповідає 23:05 за київським часом
    - cron: '5 20 * * *'
  workflow_dispatch: # Дозволяє вручну натиснути "Run workflow" за потреби

jobs:
  run-forecast:
    name: Execute Daily Forecast Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Daily Forecast (Tomorrow, ALL sources)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "🚀 Запуск щоденного автоматичного прогнозування на завтра..."
          echo "📡 Backend Target: $BACKEND_URL"
          
          # Запит до захищеного cron ендпоінта (дата = завтра, джерела = OpenWeatherMap + Open-Meteo)
          URL="$BACKEND_URL/api/v1/forecast/cron/daily-batch?weather_source=ALL"
          
          echo "🌐 Виклик: $URL"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --max-time 180 \
            -X POST "$URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)
          
          echo "📥 Відповідь сервера (HTTP $HTTP_STATUS):"
          echo "$HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Прогноз на завтра успішно розраховано для обох джерел (OWM + Open-Meteo) і збережено в Neon DB!"
          else
            echo "❌ Помилка виконання прогнозу (HTTP $HTTP_STATUS)"
            exit 1
          fi
